<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>context-economy - Where your spend goes</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --teal:#0FB5A6;--teal-deep:#0A7A70;--teal-soft:#E6F7F5;--amber:#FFB627;--amber-soft:#FFF3D6;
    --ink:#102A2E;--cream:#FBF7EF;--paper:#fff;--feather:#7C9092;--leaf:#3CB371;--coral:#FF7A66;--line:#ECE7DB;
    --shadow-sm:0 2px 10px rgba(16,42,46,.06);--shadow-md:0 16px 40px rgba(16,42,46,.12);
    --fd:'Quicksand',sans-serif;--fb:'Inter',sans-serif;--done:#1F9E73;--wip:#E0A11E;
    --bg:var(--cream);--panel:var(--paper);--panel2:var(--cream);--dim:var(--feather);--faint:#9aa7a6;
    --mint:var(--teal);--ochre:var(--teal-deep);--warn:var(--coral);--surface:var(--teal-soft);--code-bg:#F0EDE3;--tip-bg:var(--paper);
    --shadow:rgba(16,42,46,.1);--chart-grid:#e8f0ef;--chart-axis:var(--feather);--chart-zone:#b8d4d0;
    --mono:ui-monospace,Menlo,Consolas,monospace;--sans:var(--fb);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink)}
  body{font-family:var(--fb);font-size:14px;line-height:1.55;padding:30px 18px 70px;-webkit-font-smoothing:antialiased;
    background:radial-gradient(680px 360px at 8% -8%,rgba(15,181,166,.10),transparent 60%),
      radial-gradient(560px 360px at 104% 4%,rgba(255,182,39,.10),transparent 56%),var(--cream);}
  .wrap{max-width:960px;margin:0 auto}
  h1,h2,h3{font-family:var(--fd);letter-spacing:-.02em;line-height:1.15}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .top .mk{width:40px;height:40px;border-radius:12px;background:var(--teal);display:grid;place-items:center;font-size:21px;box-shadow:var(--shadow-sm);flex:none}
  h1{font-size:27px;font-weight:700;margin:0}
  h1 b{color:var(--teal-deep)}
  .sub{font-size:13px;color:var(--feather);margin-top:2px}
  .meta{font-size:12px;color:var(--feather);margin:2px 0 16px}
  .meta b{color:var(--ink);font-weight:600}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .khead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:2px}
  .stat{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px 16px;overflow:hidden;box-shadow:var(--shadow-sm)}
  .stat .k{font-family:var(--fd);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--feather);flex:1;min-width:0;line-height:1.4;font-weight:700}
  .stat .tag{flex:none;white-space:nowrap;font-family:var(--fd);font-size:9.5px;letter-spacing:.08em;padding:3px 8px;border-radius:999px;margin-top:1px;font-weight:700}
  .tag.meas{background:var(--teal-soft);color:var(--teal-deep);border:1px solid rgba(15,181,166,.25)}
  .tag.prelim{background:rgba(255,122,102,.1);color:var(--coral);border:1px solid rgba(255,122,102,.28)}
  .tag.ref{background:rgba(124,144,146,.1);color:var(--feather);border:1px solid var(--line)}
  .stat .v{font-family:var(--fd);font-weight:700;font-size:46px;line-height:1;margin:14px 0 6px;letter-spacing:-.02em;color:var(--teal-deep)}
  .stat.hero .v{font-size:56px;color:var(--teal)}
  .v.mint{color:var(--teal)} .v.dim{color:var(--feather)} .v.struck{color:var(--faint)}
  .stat .d{font-size:12.5px;color:var(--feather);line-height:1.45}
  .stat .d em{color:var(--ink);font-style:normal;font-weight:500}
  .stat .spark{height:3px;margin-top:13px;background:linear-gradient(90deg,var(--teal),transparent);border-radius:99px;opacity:.55}
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px 14px;margin-top:14px;box-shadow:var(--shadow-sm)}
  .panel .cap{font-family:var(--fd);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--feather);margin-bottom:8px;font-weight:700}
  .panel svg text{font-family:var(--mono)}
  .legend{display:flex;gap:20px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:6px;letter-spacing:.02em}
  .legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:7px}
  .tips{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:14px;box-shadow:var(--shadow-sm)}
  .tips .h{font-family:var(--fd);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-deep);margin-bottom:10px;font-weight:700}
  .tips ul{list-style:none}
  .tips li{position:relative;padding-left:22px;margin:7px 0;color:var(--ink);font-size:13.5px}
  .tips li::before{content:"›";position:absolute;left:4px;color:var(--teal);font-weight:700;font-size:16px}
  .tips code{background:var(--code-bg);color:var(--teal-deep);padding:1px 6px;border-radius:5px;font-family:var(--mono);font-size:12px}
  .stable{display:flex;flex-direction:column;gap:6px;margin-top:4px;overflow:visible}
  .srow{display:grid;grid-template-columns:minmax(80px,1.2fr) 2.6fr auto auto minmax(72px,auto);align-items:center;gap:8px;font-size:12.5px;position:relative;overflow:visible}
  .vtag{font-family:var(--mono);font-size:9px;letter-spacing:.03em;padding:3px 6px;border-radius:5px;white-space:nowrap;text-align:center}
  .vtag.safe{color:var(--mint);border:1px solid rgba(54,224,166,.35);background:rgba(54,224,166,.08)}
  .vtag.in-use{color:var(--warn);border:1px solid rgba(255,90,71,.4);background:rgba(255,90,71,.1)}
  .vtag.caution{color:var(--amber);border:1px solid rgba(255,176,0,.35);background:rgba(255,176,0,.08)}
  .vtag.protected,.vtag.off{color:var(--dim);border:1px solid var(--line)}
  .projpick{margin:0 0 10px;font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .projpick select{font-family:var(--mono);font-size:11px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 8px;max-width:100%}
  .projpick b{color:var(--ink)}
  .projpick .phint{font-family:var(--mono);font-size:10px;color:var(--faint)}
  .stalebanner{margin:0 0 14px;border:1px solid rgba(255,122,102,.28);border-left:4px solid var(--coral);background:rgba(255,122,102,.08);border-radius:13px;padding:12px 15px;font-size:13px;color:#7a3a30;line-height:1.5}
  .stalebanner b{color:var(--coral)}
  .stalebanner code{background:var(--code-bg);color:var(--teal-deep);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:11px}
  .hidnote{margin:8px 0 2px;font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.04em}
  .srow.has-tip{cursor:help}
  #skill-tip{position:fixed;z-index:20;max-width:min(300px,92vw);padding:9px 11px;border-radius:9px;background:var(--tip-bg);border:1px solid var(--line);box-shadow:0 8px 24px var(--shadow);font-family:var(--sans);font-size:12px;line-height:1.45;color:var(--ink);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .14s,transform .14s}
  #skill-tip.show{opacity:1;transform:translateY(0)}
  #skill-tip.is-wait{color:var(--dim);font-style:italic}
  #skill-tip small{display:block;margin-top:5px;font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
  #chart-tip{position:fixed;z-index:21;max-width:min(240px,92vw);padding:8px 11px;border-radius:9px;background:var(--tip-bg);border:1px solid var(--line);border-left:3px solid var(--amber);box-shadow:0 8px 24px var(--shadow);font-family:var(--mono);font-size:11.5px;line-height:1.45;color:var(--ink);pointer-events:none;opacity:0;transform:translate(6px,6px);transition:opacity .1s}
  #chart-tip.show{opacity:1}
  #chart-tip b{color:var(--amber);font-weight:600}
  #chart-tip span{color:var(--dim);font-size:10px}
  .chart-panel .chart-plot-hit{cursor:crosshair}
  .chart-cross{stroke:var(--amber);stroke-width:1;stroke-dasharray:4 4;opacity:.55;pointer-events:none}
  .chart-hover-dot{fill:var(--amber);stroke:var(--panel);stroke-width:2;pointer-events:none;opacity:0;transition:opacity .1s}
  .chart-hover-dot.show{opacity:1}
  .chart-bar{transition:opacity .12s}
  .chart-bars.hovering .chart-bar{opacity:.42}
  .chart-bars.hovering .chart-bar.is-active{opacity:1}
  .srow.is-off{opacity:.52}
  .soff-head,.projused-head{font-family:var(--fd);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin:14px 0 6px;padding-top:10px;border-top:1px solid var(--line);font-weight:700}
  .soff-head{color:var(--coral)}
  .projused-head{color:var(--teal-deep);border-top-color:rgba(15,181,166,.25)}
  .srow.is-here .sn{color:var(--teal-deep)}
  .srow.is-here .sbar i{background:linear-gradient(90deg,var(--teal),rgba(15,181,166,.45))}
  #projSel.is-loading{opacity:.45}
  .soff .srow{border-left:2px solid rgba(255,90,71,.4);padding-left:8px;opacity:1}
  .srow .sn{font-family:var(--mono);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .srow .sbar{height:8px;background:#f0ede3;border-radius:99px;overflow:hidden}
  .srow .sbar i{display:block;height:100%;background:var(--dim);border-radius:5px}
  .srow .sv{font-family:var(--mono);color:var(--dim);text-align:right;min-width:46px}
  .srow .sv.hot{color:var(--amber);font-weight:700}
  .srow .suse{font-family:var(--mono);font-size:10px;text-align:right;min-width:30px}
  .suse.off{color:var(--warn)} .suse.on{color:var(--faint)}
  .stoggle{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;padding:4px 8px;border-radius:6px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--dim);min-width:58px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
  .stoggle:hover:not(:disabled):not(.is-busy){border-color:var(--amber);color:var(--amber)}
  .stoggle.can-safe{color:var(--done);border-color:rgba(31,158,115,.45);background:rgba(31,158,115,.1)}
  .stoggle.can-safe:hover:not(:disabled):not(.is-busy){border-color:var(--done);color:var(--done);box-shadow:0 0 12px rgba(31,158,115,.2)}
  .stoggle.can-caution{color:var(--wip);border-color:rgba(224,161,30,.45);background:var(--amber-soft)}
  .stoggle.can-caution:hover:not(:disabled):not(.is-busy){border-color:var(--wip);color:var(--wip);box-shadow:0 0 12px rgba(224,161,30,.18)}
  .stoggle.is-blocked{color:var(--warn);border-color:rgba(255,90,71,.35);opacity:.45}
  .stoggle.is-off{color:var(--mint);border-color:rgba(54,224,166,.35)}
  .stoggle:disabled:not(.is-busy){opacity:.35;cursor:not-allowed}
  .stoggle.is-busy{opacity:1;cursor:wait;pointer-events:none;color:var(--dim);border-color:var(--ochre);min-width:72px}
  .stoggle .spin{width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--amber);border-radius:50%;animation:spin .65s linear infinite;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .srow.is-busy .sn{color:var(--dim)}
  .srow.is-busy .sbar i{opacity:.35}
  .servehint{margin-top:10px;padding:10px 12px;border:1px dashed rgba(200,120,0,.35);border-radius:10px;font-size:12px;color:#5c4a20;line-height:1.45}
  .servehint code{background:var(--code-bg);color:var(--mint);padding:1px 5px;border-radius:4px;border:1px solid var(--line);font-family:var(--mono);font-size:11px}
  .toast{position:fixed;bottom:22px;right:22px;max-width:320px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--mint);border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:11.5px;color:var(--ink);box-shadow:0 8px 24px var(--shadow);z-index:9;opacity:0;transform:translateY(8px);transition:.2s}
  .toast.show{opacity:1;transform:translateY(0)}
  .mcprow{margin-top:11px;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .mcpchip{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:2px 7px;color:var(--mint)}
  .estnote{margin-top:11px;font-size:11.5px;color:var(--dim);border-top:1px solid var(--line);padding-top:9px;line-height:1.5}
  .estnote b{color:var(--ink)}
  .estnote code{background:var(--code-bg);color:var(--mint);padding:1px 5px;border-radius:4px;border:1px solid var(--line);font-family:var(--mono)}
  .empty{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:34px;color:var(--dim);font-family:var(--mono)}
  .privnote{margin:0 0 14px;border:1px dashed rgba(121,131,154,.35);border-radius:10px;padding:10px 13px;font-size:12px;color:var(--faint);line-height:1.45}
  .privnote b{color:var(--dim)}
  .vfilter{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 10px;font-size:12px;color:var(--dim)}
  .vfilter .fl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .vchip{font-family:var(--fd);font-size:9.5px;letter-spacing:.04em;padding:4px 10px;border-radius:999px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--dim);font-weight:600}
  .vchip:hover{border-color:var(--amber);color:var(--amber)}
  .vchip.on{border-color:var(--teal);color:var(--teal-deep);background:var(--teal-soft)}
  .mtoggle{display:flex;gap:6px;margin:2px 0 12px}
  .mchip{font-family:var(--fd);font-size:10px;letter-spacing:.04em;padding:5px 12px;border-radius:999px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--dim);font-weight:700}
  .mchip:hover{border-color:var(--amber);color:var(--amber)}
  .mchip.on{border-color:var(--teal);color:var(--teal-deep);background:var(--teal-soft)}
  .srow.is-filtered{display:none}
  #filterEmpty{margin:4px 0 8px;color:var(--dim);font-size:12px;line-height:1.45}
  #filterEmpty b{color:var(--ink)}
  @media(max-width:680px){
    body{padding:18px 12px 40px}
    h1{font-size:22px}
    .stat .v{font-size:34px}
    .stat.hero .v{font-size:42px}
    .stat{padding:14px}
    .panel{padding:14px 12px 12px;border-radius:12px}
    .srow{
      grid-template-columns:1fr auto;
      grid-template-areas:"name toggle" "bar bar" "tokens usage";
      gap:6px 8px;padding:10px 0;border-bottom:1px solid var(--line);
    }
    .srow .sn{grid-area:name;white-space:normal;word-break:break-word}
    .srow .stoggle{grid-area:toggle}
    .srow .sbar{grid-area:bar}
    .srow .sv{grid-area:tokens;text-align:left;min-width:0}
    .srow .suse{grid-area:usage;text-align:left;min-width:0}
    .toast{left:12px;right:12px;bottom:14px;max-width:none}
    #skill-tip{max-width:calc(100vw - 24px)}
  }
</style>

<body>
<div class="wrap">
  <div class="top"><span class="mk">📊</span><div><h1>context-economy - Where your <b>spend</b> goes</h1><div class="sub">how much the conversation is costing · context telemetry</div></div></div>
  <div class="meta" id="meta">reading the data…</div>
  <div id="root"></div>
</div>

<script src="data.js" onerror="window.__noData=1"></script>
<script>
const fmt = n => n>=1e9?(n/1e9).toFixed(2)+'b':n>=1e6?(n/1e6).toFixed(1)+'m':n>=1e3?(n/1e3).toFixed(0)+'k':String(n|0);
const $=id=>document.getElementById(id);
const escAttr = s => String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;');
const escHtml = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// smooths points [[x,y],...] into a Bézier path (Catmull-Rom). lo/hi clamp the y of the controls (no overshoot).
function smooth(pts, lo, hi){
  if(pts.length<3) return 'M'+pts.map(p=>p[0]+','+p[1]).join(' L');
  const t=0.16, cy=v=>(lo==null?v:Math.max(lo,Math.min(hi,v)));
  let d='M'+pts[0][0]+','+pts[0][1];
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    d+=' C'+(p1[0]+(p2[0]-p0[0])*t).toFixed(1)+','+cy(p1[1]+(p2[1]-p0[1])*t).toFixed(1)
       +' '+(p2[0]-(p3[0]-p1[0])*t).toFixed(1)+','+cy(p2[1]-(p3[1]-p1[1])*t).toFixed(1)
       +' '+p2[0].toFixed(1)+','+p2[1].toFixed(1);
  }
  return d;
}
function avgCache(days){return days.reduce((a,d)=>a+(d.cache||0),0)/days.length}
function avgBilled(days){return days.reduce((a,d)=>a+(d.billed||0),0)/days.length}

const API = 'http://127.0.0.1:3847';
const DASHBOARD_BUILD = '1.2.0'; // keep in sync with package.json version (the API server reports PKG.version)
const API_NEEDS = ['project', 'refresh', 'data'];
let apiLive = false;
let apiStale = false;
let apiVersion = null;
let toggleBusy = false;
let verdictFilter = 'all';
let lastProjectKey = null;
let tipEl = null;
let tipRow = null;
const tipCache = new Map();
const browserLang = () => (navigator.language || document.documentElement.lang || 'en').split('-')[0].toLowerCase();

async function readJsonResponse(r){
  const text = await r.text();
  try {
    return JSON.parse(text);
  } catch {
    const preview = text.trim().slice(0, 80).replace(/\s+/g, ' ');
    if(r.status === 405 || preview.startsWith('method not allowed'))
      throw new Error('Old server on port 3847 — stop the process and restart: node scripts/dashboard-serve.cjs');
    throw new Error('Invalid response ('+r.status+'): '+preview);
  }
}

function parseDataJsText(text){
  const m = text.match(/window\.USAGE_DATA\s*=\s*(\{[\s\S]*\})\s*;/);
  if(!m) throw new Error('malformed data.js');
  return JSON.parse(m[1]);
}

async function reloadDataFromServer(){
  let data = null;
  let apiErr = null;
  try {
    const r = await fetch(API+'/api/data?'+Date.now());
    const j = await readJsonResponse(r);
    if(!j.ok) throw new Error(j.error || 'failed to read /api/data');
    data = j.data;
  } catch (e) {
    apiErr = e;
    try {
      const r2 = await fetch(API+'/data.js?'+Date.now());
      data = parseDataJsText(await r2.text());
    } catch {
      throw apiErr;
    }
  }
  window.USAGE_DATA = data;
  await probeApi();
  build(window.USAGE_DATA);
  return true;
}

function serverMismatchHelp(){
  return 'Old server on port 3847. In the terminal: Ctrl+C on the old process, then '
    + 'node scripts/dashboard-serve.cjs — and in the browser Ctrl+Shift+R (hard refresh).';
}

async function probeApi(){
  apiLive = false;
  apiStale = false;
  apiVersion = null;
  try{
    const r = await fetch(API+'/api/ping', { signal: AbortSignal.timeout(800) });
    if(!r.ok) return;
    const j = await readJsonResponse(r);
    apiLive = !!j.ok;
    apiVersion = j.version || null;
    apiStale = apiLive && (
      !Array.isArray(j.features)
      || API_NEEDS.some(f => !j.features.includes(f))
      || (j.version && j.version !== DASHBOARD_BUILD)
    );
  }catch{ /* offline */ }
}

function toast(msg, ok){
  let el = document.getElementById('toast');
  if(!el){ el = document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.style.borderLeftColor = ok ? 'var(--mint)' : 'var(--warn)';
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 4200);
}

const D = window.USAGE_DATA;
if(window.__noData || !D || !D.days || !D.days.length){
  $('meta').textContent='no data yet';
  $('root').innerHTML='<div class="empty">Nothing to show yet. Run <code>node scripts/dashboard.cjs</code> and refresh the page (F5).</div>';
} else probeApi().then(()=>build(D));

function projectKey(D){
  const P = D?.project || {};
  return P.mode === 'all' ? '__all__' : normPath(P.dir || '');
}

function build(D){
  const pk = projectKey(D);
  if(pk !== lastProjectKey){
    verdictFilter = 'on'; // project selector removed — always global (all-projects) view
    lastProjectKey = pk;
  }

function ensureTipEl(){

    tipEl.setAttribute('role','tooltip');
    document.body.appendChild(tipEl);
  }

}

function placeSkillTip(row){
  const el = ensureTipEl();
  const r = row.getBoundingClientRect();
  const gap = 8;
  let top = r.top - el.offsetHeight - gap;
  if(top < 8) top = r.bottom + gap;
  let left = r.left;
  const maxLeft = window.innerWidth - el.offsetWidth - 8;
  if(left > maxLeft) left = Math.max(8, maxLeft);
  el.style.left = left + 'px';
  el.style.top = top + 'px';
}

  const el = ensureTipEl();
  el.classList.toggle('is-wait', !!waiting);
  const priv = lang && lang !== 'en' && apiLive ? '<small>translated · '+lang+' · via Google proxy</small>' : (lang && lang !== 'en' ? '<small>translated · '+lang+'</small>' : '');

async function showSkillTip(row){

// --- the consolidated chart: stacked-by-model bars (cost/day) + an overlay line (volume or avg/turn) ---
// Expand the data-days (only days WITH activity) into a continuous calendar:
// one slot per day from first to last, zero-filled for days with no usage.
// Without this, a 20-day gap renders as two adjacent bars — days look "spaced".
function fillDays(days){
  if(!days || days.length<2) return days||[];
  const byDate = new Map(days.map(d=>[d.date,d]));
  const zero = iso => ({date:iso,billed:0,cache:0,work:0,msgs:0,screenshots:0,opus:0,sonnet:0,haiku:0,fable:0,other:0});
  const [ys,ms,ds]=days[0].date.split('-').map(Number);
  const [ye,me,de]=days[days.length-1].date.split('-').map(Number);
  const out=[]; let cur=Date.UTC(ys,ms-1,ds); const end=Date.UTC(ye,me-1,de);
  while(cur<=end){ const iso=new Date(cur).toISOString().slice(0,10); out.push(byDate.get(iso)||zero(iso)); cur+=86400000; }
  return out;
}
const CHART_DAYS = 30; // recent window: dense daily view, drops the sparse ancient history
function comboPanel(days, models){
  if(!days || !days.length) return '';
  days = fillDays(days).slice(-CHART_DAYS); // continuous calendar, last 30 days
  // Use the last 14 days for the headline — reflects RECENT behaviour, not the full history
  const win14 = days.slice(-14);
  const tot14 = win14.reduce((s,d)=>s+d.billed,0)||1;
  const opusPct14 = Math.round(win14.reduce((s,d)=>s+(d.opus||0),0)/tot14*100);
  const sonnetPct14 = Math.round(win14.reduce((s,d)=>s+(d.sonnet||0),0)/tot14*100);
  const decide = opusPct14>=40
    ? '🔴 <b>Opus</b> is at '+opusPct14+'% of your billed tokens (last 14 days) — it is filling your <b>weekly cap</b>. Sonnet is at '+sonnetPct14+'%. Moving routine work to Sonnet is the lever to stay within your plan.'
    : '🟢 Opus at <b>'+opusPct14+'%</b> over the last 14 days — your spend is not concentrated on it. Good signal for the weekly cap.';
  const W=920,H=360,Pl=66,Pr=58,Pt=18,Pb=46, iw=W-Pl-Pr, ih=H-Pt-Pb;
  const n=days.length, slot=iw/n, bw=Math.max(2,Math.min(slot*0.66,46));
  const lineVal = d => d.msgs ? d.billed/d.msgs : 0; // avg/turn — the dimension the bars don't already echo
  const maxBilled = Math.max(1, ...days.map(d=>d.billed));
  const maxLine = Math.max(1, ...days.map(lineVal));
  // √ scale on bar heights: one outlier day (100m+) crushes normal days (~5m) to sub-pixel
  // bars on a linear axis; sqrt keeps every day visible while preserving the ranking.
  const yL = v => Pt+ih-Math.sqrt(Math.max(0,v)/maxBilled)*ih;
  const LINE_FRAC = 0.65; // cap line visual height so it reads below bars at their peak (dual-axis secondary)
  const yR = v => Pt+ih-(Math.min(v,maxLine)/maxLine)*ih*LINE_FRAC;
  const cxx = i => Pl+slot*(i+0.5);
  let ticks='';
  for(let t=0;t<=4;t++){ const v=maxBilled*Math.pow(t/4,2), yy=yL(v); // squared fractions → evenly spaced gridlines under the √ scale
    ticks+='<line x1="'+Pl+'" y1="'+yy.toFixed(1)+'" x2="'+(W-Pr)+'" y2="'+yy.toFixed(1)+'" stroke="var(--chart-grid)"/>'

  let rticks='';

    rticks+='<text x="'+(W-Pr+8)+'" y="'+(yy+4).toFixed(1)+'" fill="#2C6FB0" font-size="10" text-anchor="start">'+fmt(v)+'</text>'; }
  const order=['opus','sonnet','haiku','fable','other'];
  let bars='';
  days.forEach((d,i)=>{ const x=cxx(i)-bw/2; let acc=0;
    order.forEach(k=>{ const v=d[k]||0; if(v<=0) return; const y0=yL(acc),y1=yL(acc+v); acc+=v;
      bars+='<rect x="'+x.toFixed(1)+'" y="'+y1.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,y0-y1).toFixed(1)+'" fill="'+MODEL_COLORS[k]+'"/>'; }); });
  const pts=days.map((d,i)=>[cxx(i), yR(lineVal(d))]);
  const path=smooth(pts, Pt+ih*(1-LINE_FRAC), Pt+ih);
  let xl=''; const step=Math.max(1,Math.ceil(n/12));
  for(let i=0;i<n;i+=step){ xl+='<text x="'+cxx(i).toFixed(1)+'" y="'+(H-15)+'" fill="var(--chart-axis)" font-size="10" text-anchor="middle">'+escHtml(days[i].date.slice(5))+'</text>'; }
  const present=['opus','sonnet','haiku','fable','other'].filter(k=>days.some(d=>(d[k]||0)>0));
  const legend='<div class="legend">'
    +present.map(k=>'<span><i style="background:'+MODEL_COLORS[k]+';width:11px;height:11px;border-radius:2px"></i>'+modelTitle(k)+'</span>').join('')
    +'<span><i style="background:#378ADD;width:16px;height:3px"></i>avg/turn (right axis)</span>'
    +'</div>';
  const meta=JSON.stringify({n,slot,pl:Pl,pt:Pt,iw,ih});
  const dd=JSON.stringify(days.map(d=>({date:d.date,billed:d.billed,msgs:d.msgs,screenshots:d.screenshots||0,opus:d.opus||0,sonnet:d.sonnet||0,haiku:d.haiku||0,fable:d.fable||0,avg:lineVal(d)})));
  const shots14 = win14.reduce((s,d)=>s+(d.screenshots||0),0);
  const shotNote = shots14 > 0
    ? '📸 <b>'+shots14+' screenshots</b> in the last 14 days — each one adds ~500k–2m tok to context and is re-read every turn. Prefer <code>preview_snapshot</code> for text/structure checks.'
    : '';
  const head = days.length
    ? '<div style="font-family:var(--fd);font-size:30px;font-weight:700;color:'+(opusPct14>=40?'#E0533C':'var(--teal-deep)')+';line-height:1;margin:2px 0 8px">Opus '+opusPct14+'% <span style="font-size:14px;color:var(--dim);font-weight:500">of billed tokens (last 14 days) — what fills your weekly cap</span></div>'
      +'<div class="estnote" style="margin:0 0 12px">'+decide+'</div>'

    : '';
  return '<div class="panel chart-panel" id="spend-chart" data-chart="'+escAttr(meta)+'" data-days="'+escAttr(dd)+'">'
    +'<div class="cap">spend by model · last 30 days — where to decide Opus × Sonnet (your bottleneck is the weekly cap, not the 5h window)</div>'
    + head
    +'<svg viewBox="0 0 '+W+' '+H+'" width="100%">'
    + ticks + rticks + bars
    +'<path d="'+path+'" fill="none" stroke="#378ADD" stroke-width="2"/>'
    +'<rect class="chart-plot-hit" x="'+Pl+'" y="'+Pt+'" width="'+iw+'" height="'+ih+'" fill="transparent"/>'
    +'<line class="chart-cross" x1="'+Pl+'" y1="'+Pt+'" x2="'+Pl+'" y2="'+(Pt+ih)+'" opacity="0"/>'
    + xl
    +'</svg>'+legend

    +'</div>';
}
function wireCombo(){
  const wrap=document.getElementById('spend-chart'); if(!wrap) return;
  const hit=wrap.querySelector('.chart-plot-hit'), svg=wrap.querySelector('svg'), cross=wrap.querySelector('.chart-cross');
  if(!hit||!svg) return;
  let meta,days; try{ meta=JSON.parse(wrap.dataset.chart||'{}'); days=JSON.parse(wrap.dataset.days||'[]'); }catch{ return; }
  if(!days.length) return;
  const tip=ensureChartTip();
  function hide(){ tip.classList.remove('show'); cross.setAttribute('opacity','0'); }
  hit.addEventListener('mousemove', e=>{
    const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    const sp=pt.matrixTransform(svg.getScreenCTM().inverse());
    const relX=sp.x-meta.pl; if(relX<0||relX>meta.iw){ hide(); return; }
    let idx=Math.floor(relX/meta.slot); idx=Math.max(0,Math.min(days.length-1,idx));
    const d=days[idx];
    const MODEL_LABELS={opus:'Opus',sonnet:'Sonnet',haiku:'Haiku',fable:'Fable'};
    const modelParts=['opus','sonnet','haiku','fable'].filter(k=>d[k]>0).map(k=>MODEL_LABELS[k]+' '+Math.round(100*d[k]/(d.billed||1))+'%');
    const shotPart = d.screenshots > 0 ? ' · 📸 '+d.screenshots : '';
    tip.innerHTML='<b>'+escHtml(formatChartDate(d.date))+'</b><br>'+fmt(d.billed)+' tok'+(modelParts.length?' · '+modelParts.join(' · '):'')+'<br><span>'+fmt(d.avg)+'/turn · '+d.msgs+' msgs'+shotPart+'</span>';
    const lx=meta.pl+meta.slot*(idx+0.5); cross.setAttribute('x1',lx); cross.setAttribute('x2',lx); cross.setAttribute('opacity','1');
    tip.classList.add('show');
    let left=e.clientX+14, top=e.clientY-8; tip.style.left=left+'px'; tip.style.top=top+'px';
    const r=tip.getBoundingClientRect();
    if(r.right>window.innerWidth-8) left=e.clientX-r.width-14;
    if(r.bottom>window.innerHeight-8) top=e.clientY-r.height-12;
    tip.style.left=Math.max(8,left)+'px'; tip.style.top=Math.max(8,top)+'px';
  });
  hit.addEventListener('mouseleave', hide);
}

function projectActivity(s){
  return (s.projectCount||0) + (s.projectReads||0);
}

function skillHasUsage(s){
  return (s.usageCount||0) > 0 || projectActivity(s) > 0;
}

function skillUsedHere(s){
  return projectActivity(s) > 0;
}

function isAllProjectMode(P){
  return P.mode === 'all' || (!P.mode && !P.dir);
}

function skillViewOpts(){
  const P = window.USAGE_DATA?.project || {};
  return isAllProjectMode(P) ? { globalOnly: true } : null;
}

/** Pool used in the chip (N) — must match what the filter displays */
function filterPool(P, skills, chip){
  if(isAllProjectMode(P)) return skills;
  if(chip === 'off') return skills.filter(s => s.disabled);
  return skills.filter(s => skillUsedHere(s));
}

/** Rows rendered in the DOM — without this, clicking the chip does not reveal missing skills */
function renderPool(P, skills){
  if(isAllProjectMode(P)) return skills;
  const byFolder = new Map();
  for(const s of skills){
    if(skillUsedHere(s) || s.disabled) byFolder.set(s.folder, s);
  }
  return [...byFolder.values()];
}

function sortSkills(list, P, chip){
  return [...list].sort((a, z) => {
    if(chip === 'used') return (z.usageCount || 0) - (a.usageCount || 0) || z.estTokens - a.estTokens;
    if(chip === 'on') return (a.disabled !== z.disabled ? (a.disabled ? 1 : -1) : 0) || (z.usageCount || 0) - (a.usageCount || 0) || z.estTokens - a.estTokens;
    if(chip === 'all') return z.estTokens - a.estTokens;
    if(a.disabled !== z.disabled) return a.disabled ? 1 : -1;
    if(isAllProjectMode(P)) return z.estTokens - a.estTokens;
    return projectActivity(z) - projectActivity(a) || z.estTokens - a.estTokens;
  });
}

function reorderSkillRows(chip){
  if(chip !== 'all') return;
  const stable = document.querySelector('.stable');
  if(!stable) return;
  const rows = [...stable.querySelectorAll('.srow[data-verdict]')];
  rows.sort((a, z) => Number(z.dataset.est || 0) - Number(a.dataset.est || 0));
  for(const row of rows) stable.appendChild(row);
}

function matchesVerdictFilter(s, code, opts){
  const f = code || verdictFilter;
  const globalOnly = opts && opts.globalOnly;
  const P = window.USAGE_DATA?.project || {};
  const isAll = isAllProjectMode(P);
  if(f === 'off') return !!s.disabled;
  if(f === 'on') return !s.disabled;
  // "in use" = enabled + history in the logs (subset of "enabled")
  if(f === 'used') return globalOnly ? !s.disabled && (s.usageCount||0) > 0 : skillHasUsage(s) && !s.disabled;
  if(f === 'here') return skillUsedHere(s);
  if(f === 'in-use') return (s.projectCount||0) > 0;
  if(f === 'all') return isAll ? true : skillUsedHere(s);
  if(s.disabled) return false;
  if(f === 'protected') return (s.verdict || '') === 'protected';
  return (s.verdict || '') === f;
}

function setVerdictFilter(code){
  verdictFilter = code;
  document.querySelectorAll('.vchip').forEach(c => c.classList.toggle('on', c.dataset.v === code));
  const opts = skillViewOpts();
  document.querySelectorAll('.srow[data-verdict]').forEach(row => {
    row.classList.toggle('is-filtered', !matchesVerdictFilter({
      disabled: row.dataset.disabled === '1',
      verdict: row.dataset.verdict,
      usageCount: Number(row.dataset.usage || 0),
      projectCount: Number(row.dataset.proj || 0),
      projectReads: Number(row.dataset.reads || 0),
    }, verdictFilter, opts));
  });
  reorderSkillRows(code);
  const b = window.USAGE_DATA?.bloat;
  const P = window.USAGE_DATA?.project || {};
  const skills = b?.skills || [];
  const pool = filterPool(P, skills, verdictFilter);
  const n = pool.filter(s => matchesVerdictFilter(s, verdictFilter, opts)).length;
  const hint = document.getElementById('filterHint');
  const empty = document.getElementById('filterEmpty');
  const emptyHelp = {
    here: 'No skills in this project\'s transcripts. Change the dropdown, select <b>all</b>, or open the repo in Claude Code.',
    'in-use': '<b>Invoked here</b> = the "Base directory for this skill" line in the logs. SKILL.md reads show up under <b>in this repo</b>.',
    on: 'No skills enabled in ~/.claude/skills/.',
    used: 'No enabled skills with usage in the logs. See <b>enabled</b> (includes 0×) or <b>disabled</b>.',
    caution: 'None in caution in this project.',
    safe: 'No safe candidates to disable (0× here and 0× global).',
    off: 'No disabled skills.',
  };
  if(hint) hint.textContent = verdictFilter === 'all' ? '' : n+' visible';
  if(empty){
    empty.hidden = verdictFilter === 'all' || n > 0;
    if(!empty.hidden) empty.innerHTML = emptyHelp[verdictFilter] || 'No skills in this filter.';
  }
}

function wireVerdictFilter(){
  document.querySelectorAll('.vchip').forEach(chip => {
    chip.addEventListener('click', () => setVerdictFilter(chip.dataset.v));
  });
  setVerdictFilter(verdictFilter);
}

// "what costs the most per session" panel — ranking of skills by ESTIMATED cost (not exact).
function skillCostPanel(b, project){
  if(!b || !b.skills || !b.skills.length) return '';
  const clean = n => n.length>24 ? n.slice(0,23)+'…' : n;
  const P = project || {};
  const showTranslatePriv = apiLive && browserLang() !== 'en';

  // Project selector removed — the panel always shows the global (all-projects) skill view.
  const isAllMode = true;
  const isProjectMode = false;

  const filterOpts = isAllMode ? { globalOnly: true } : null;

  function skillRow(s, i, max, opts){
    const hotFirst = opts && opts.hotFirst;
    const w = Math.max(3, Math.round(100*s.estTokens/max));
    const hot = hotFirst && i === 0;
    const pa = projectActivity(s);
    const useCount = isAllMode ? (s.usageCount||0) : pa;
    const useLabel = useCount > 0 ? useCount+'×' : '0×';
    const use = s.neverUsed && !s.projectCount && !pa
      ? '<span class="suse off">'+useLabel+'</span>'
      : '<span class="suse'+(s.projectCount?' off':' on')+'">'+useLabel+'</span>';
    const on = !s.disabled;
    const reason = on ? escAttr(s.verdictReason||'') : '';
    let cls = on ? (s.verdict === 'safe' ? 'can-safe' : 'can-caution') : 'is-off';
    const title = reason ? ' title="'+reason+'"' : '';
    const btn = '<button type="button" class="stoggle '+cls+'"'+title+' onclick="toggleSkill(\''+s.folder+'\','+!on+',this)">'+(on?'Disable':'Enable')+'</button>';
    const tip = s.desc ? escAttr(s.desc) : '';
    const tipExtra = (!s.disabled && s.verdictReason) ? '\n\n'+s.verdictReason : '';
    const filtered = !matchesVerdictFilter(s, verdictFilter, filterOpts);
    const here = isAllMode ? (s.usageCount||0) > 0 : pa > 0;
    return '<div class="srow'+(here?' is-here':'')+(tip?' has-tip':'')+(filtered?' is-filtered':'')+'" data-est="'+s.estTokens+'" data-verdict="'+escAttr(s.verdict||'')+'" data-disabled="'+(s.disabled?'1':'0')+'" data-usage="'+(s.usageCount||0)+'" data-proj="'+(s.projectCount||0)+'" data-reads="'+(s.projectReads||0)+'"'+(tip?' data-tip="'+tip+escAttr(tipExtra)+'"':'')+'>'
      + '<span class="sn">'+clean(s.folder)+'</span>'
      + '<span class="sbar"><i style="width:'+w+'%'+(hot?';background:linear-gradient(90deg,var(--amber),var(--ochre))':'')+'"></i></span>'
      + '<span class="sv'+(hot?' hot':'')+'">~'+s.estTokens+'</span>'
      + use
      + btn
      + '</div>';
  }

  function rowsFor(list, opts){
    const max = Math.max(...list.map(s=>s.estTokens), 1);
    return list.map((s,i)=>skillRow(s,i,max,opts)).join('');
  }

  const enabledN = b.skills.filter(s => !s.disabled).length;
  const globallyUsed = b.skills.filter(s => !s.disabled && (s.usageCount||0) > 0);
  const usedHere = b.skills.filter(s => skillUsedHere(s));
  const disabledN = b.skills.filter(s => s.disabled).length;
  const rows = sortSkills(renderPool(P, b.skills), P, verdictFilter);

  let sectionHead = '';
  let hiddenNote = '';
  if(isAllMode){
    if(verdictFilter === 'all') sectionHead = '<div class="projused-head">all skills · '+b.skills.length+'</div>';
    else if(verdictFilter === 'on') sectionHead = '<div class="projused-head">enabled · '+enabledN+'</div>';
    else if(verdictFilter === 'used') sectionHead = '<div class="projused-head">in use in the logs · '+globallyUsed.length+' <span style="color:var(--faint);font-weight:500">(of '+enabledN+' enabled)</span></div>';
    else if(verdictFilter === 'off') sectionHead = '<div class="projused-head">disabled · '+disabledN+'</div>';
    if(!globallyUsed.length && verdictFilter === 'used') hiddenNote = '<div class="hidnote">No enabled skills with usage in the logs. Skills enabled but 0× appear under <b>enabled</b>.</div>';
  } else if(isProjectMode){
    if(verdictFilter === 'off') sectionHead = '<div class="projused-head">disabled · '+disabledN+'</div>';
    else if(usedHere.length) sectionHead = '<div class="projused-head">used in this project · '+usedHere.length+'</div>';
    if(!usedHere.length && verdictFilter !== 'off' && P.filesScanned === 0) hiddenNote = '<div class="hidnote">No transcripts for this project. Open the repo in Claude Code or select <b>all</b> in the dropdown.</div>';
    else if(!usedHere.length && verdictFilter !== 'off' && P.filesScanned > 0) hiddenNote = '<div class="hidnote">No skills detected in the '+P.filesScanned+' transcripts read.</div>';
  }
  const activeRows = rowsFor(rows);

  const mcp = (b.mcp||[]).map(m=>{const t=(m.toolCount!=null&&m.toolCount>0)?m.toolCount+'t ':'';const tok=m.estHi&&m.estHi>m.estTokens?'~'+m.estTokens+'–'+m.estHi:'~'+m.estTokens;return '<span class="mcpchip">'+m.name+' '+t+tok+'</span>';}).join(' ');
  const mcpSum = (b.estMcpTokens != null)
    ? ' · MCP ~'+b.estMcpTokens.toLocaleString()+(b.estMcpTokensHi && b.estMcpTokensHi > b.estMcpTokens ? '–'+b.estMcpTokensHi.toLocaleString() : '')+' tok'
    : '';
  const total = b.estTokensPerSession ? '~'+b.estTokensPerSession.toLocaleString()+' fixed tok/session' : '';
  const filterDefs = isAllMode
    ? [['all','all'], ['on','enabled'], ['used','in use'], ['off','disabled']]
    : [['all','all'], ['here','in this repo'], ['in-use','invoked here'], ['off','disabled']];
  const vfilter = '<div class="vfilter"><span class="fl">filter</span>'
    + filterDefs.map(([v, label]) => {
      const pool = filterPool(P, b.skills, v);
      const n = pool.filter(s => matchesVerdictFilter(s, v, filterOpts)).length;
      const on = verdictFilter === v ? ' on' : '';
      return '<button type="button" class="vchip'+on+'" data-v="'+v+'">'+label+' ('+n+')</button>';
    }).join('')
    + ' <span class="phint" id="filterHint"></span></div>'
    + '<div class="hidnote" id="filterEmpty" hidden></div>';
  const priv = showTranslatePriv
    ? '<div class="privnote">🔒 <b>Translation privacy:</b> on hover, the skill description leaves your PC for the Google proxy (via the local server). Only with a non-English browser and an active server.</div>'
    : '';
  return '<div class="panel">'
    + '<div class="cap">what costs the most per session · skills '+(total?'('+total+')':'')+'</div>'
    + priv
    + vfilter
    + sectionHead
    + '<div class="stable">'+activeRows+'</div>'
    + hiddenNote
    + (mcp ? '<div class="mcprow">Active MCP: '+mcp+mcpSum+'</div>' : '')
    + '</div>';
}

function dayMs(iso){ return new Date(iso+'T12:00:00').getTime(); }

</script>
